<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06122a">
<title>Listen | Kulzzy Radio</title>

<style>
:root{--n:#06122a;--p:#0c1c3b;--g:#ffd700}
*{box-sizing:border-box}
body{margin:0;background:var(--n);color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:650px;margin:auto;padding:20px}
.card{background:var(--p);border:1px solid #2b4065;border-radius:18px;padding:20px;text-align:center;margin-top:20px}
h1{font-size:24px;color:var(--g)}
img{width:140px;height:140px;border-radius:16px;object-fit:cover}
p{color:#c4cee0;line-height:1.5}
audio{width:100%;margin:18px 0}
.btn{display:inline-block;background:var(--g);color:#06122a;text-decoration:none;font-weight:bold;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
.status{background:#10284b;padding:12px;border-radius:10px;margin:12px 0}
.small{font-size:12px;color:#9facbf}
</style>
</head>

<body>
<main class="wrap">
  <div class="card">
    <h1 id="title">Loading song…</h1>
    <img id="photo" alt="Artiste photo" hidden>
    <p id="artist"></p>

    <audio id="audio" controls preload="metadata"></audio>

    <div class="status" id="status">Loading song details…</div>

    <p>Keep this page open and listen for at least 60 seconds. One qualifying stream per account per song per month.</p>

    <a class="btn" href="index.html">Back to rankings</a>

    <p class="small">Your listening session works with Kulzzy Radio Universal Media Control.</p>
  </div>
</main>

<script>
(function(){
  "use strict";

  window.KULZZY_STOP_PLAYER = function(){
    var audio = document.getElementById("audio");

    if(audio){
      try{audio.pause()}catch(e){}
    }

    if(window.KULZZY_MUSIC_TIMER){
      clearInterval(window.KULZZY_MUSIC_TIMER);
      window.KULZZY_MUSIC_TIMER = null;
    }

    window.KULZZY_MUSIC_STARTED = false;

    var status = document.getElementById("status");

    if(status){
      status.textContent = "Listening paused because another Kulzzy Radio player started.";
    }
  };
})();
</script>

<script src="./connector.js"></script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get,set}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAYZyCFYGP2Kk_JUiyc9N9TkLUXfb9pv9E",
  authDomain:"music-streaming-e724e.firebaseapp.com",
  databaseURL:"https://music-streaming-e724e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"music-streaming-e724e",
  storageBucket:"music-streaming-e724e.firebasestorage.app",
  messagingSenderId:"543568067808",
  appId:"1:543568067808:web:495540085bf8b3e080a485",
  measurementId:"G-7KMXGYVCF9"
};

const app=initializeApp(firebaseConfig,"KulzzyMusicListeningPage");
const db=getDatabase(app);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

const songId=new URLSearchParams(location.search).get("song");

function getLagosMonth(){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Africa/Lagos",
    year:"numeric",
    month:"2-digit"
  }).formatToParts(new Date());

  const year=parts.find(p=>p.type==="year").value;
  const month=parts.find(p=>p.type==="month").value;

  return year+month;
}

const month=getLagosMonth();

let seconds=0;
let completed=false;
let started=false;
let timer=null;
let recording=false;

function message(text){
  $("status").textContent=text;
}

function stopTimer(){
  started=false;

  if(timer){
    clearInterval(timer);
    timer=null;
  }

  window.KULZZY_MUSIC_TIMER=null;
}

async function recordQualifyingStream(){
  if(completed||recording)return;

  recording=true;
  stopTimer();

  try{
    const uid=auth.currentUser.uid;

    const voteRef=ref(
      db,
      "votes/"+songId+"/"+month+"/"+uid
    );

    const existing=await get(voteRef);

    if(existing.exists()){
      completed=true;
      message("You have already earned a qualifying stream for this song this month.");
      return;
    }

    await set(voteRef,{
      qualifiedAt:Date.now()
    });

    completed=true;

    message("Thank you! Your qualifying stream has been recorded.");

  }catch(error){
    completed=false;
    message("Could not record stream. Please try again.");
    console.error("[Kulzzy Music] Stream recording error:",error);
  }finally{
    recording=false;
  }
}

function startTimer(){
  if(completed||recording||timer)return;

  started=true;

  timer=setInterval(function(){
    const audio=$("audio");

    if(!started||audio.paused||audio.ended)return;

    seconds++;

    if(seconds>=60){
      recordQualifyingStream();
    }
  },1000);

  window.KULZZY_MUSIC_TIMER=timer;
}

async function start(){
  if(!songId){
    message("No song selected.");
    return;
  }

  try{
    await signInAnonymously(auth);

    const songSnapshot=await get(
      ref(db,"songs/"+songId)
    );

    const song=songSnapshot.val();

    if(!song){
      message("Song not found.");
      return;
    }

    $("title").textContent=song.title||"Song";
    $("artist").textContent=song.artist||"";

    if(song.photo){
      $("photo").src=song.photo;
      $("photo").hidden=false;
    }

    let audioUrl=song.url||"";

    const driveMatch=audioUrl.match(
      /drive\.google\.com\/file\/d\/([^/]+)/
    );

    if(driveMatch){
      audioUrl=
        "https://drive.google.com/uc?export=download&id="+
        driveMatch[1];
    }

    if(!audioUrl){
      message("This song has no audio link.");
      return;
    }

    $("audio").src=audioUrl;

    const settingsSnapshot=await get(
      ref(db,"settings")
    );

    const settings=settingsSnapshot.val()||{};
    const now=Date.now();

    if(settings.openDate&&now<new Date(settings.openDate).getTime()){
      message("Competition has not opened yet.");
      $("audio").controls=false;
      return;
    }

    if(settings.closeDate&&now>new Date(settings.closeDate).getTime()){
      message("Competition is closed.");
      $("audio").controls=false;
      return;
    }

    message("Press play to begin listening.");

    $("audio").addEventListener("play",function(){
      if(!completed&&!recording){
        startTimer();
      }
    });

    $("audio").addEventListener("pause",function(){
      stopTimer();

      if(!completed){
        message("Paused. Resume playback to continue.");
      }
    });

    $("audio").addEventListener("ended",function(){
      stopTimer();

      if(!completed){
        message("Listening ended before the 60-second qualification.");
      }
    });

    $("audio").addEventListener("error",function(){
      stopTimer();
      message("Could not play this song. Please check the audio link.");
    });

  }catch(error){
    message("Could not load song. Please try again.");
    console.error("[Kulzzy Music] Loading error:",error);
  }
}

start();
</script>
</body>
</html>
