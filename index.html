<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06122a">
<title>Best Streaming Song of the Month | Kulzzy Radio</title>

<style>
:root{
--n:#06122a;
--p:#0c1c3b;
--g:#ffd700;
--m:#b8c2d8
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--n);
color:#fff;
font-family:Arial,sans-serif
}

/* CLOSE BUTTON */

.close-area{
width:100%;
height:54px;
padding:8px 14px;
display:flex;
justify-content:flex-end;
align-items:center;
background:linear-gradient(140deg,#0b2046,#06122a);
}

.close-button{
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid var(--g);
border-radius:50%;
background:var(--g);
color:#06122a;
font-size:27px;
font-weight:900;
line-height:1;
cursor:pointer;
box-shadow:0 0 12px rgba(255,215,0,.35);
transition:transform .15s;
}

.close-button:active{
transform:scale(.90)
}

header{
text-align:center;
padding:15px 14px 18px;
background:linear-gradient(140deg,#0b2046,#06122a);
border-bottom:1px solid #293b5d
}

header h1{
color:var(--g);
font-size:clamp(22px,5vw,34px);
margin:0 0 8px
}

header p{
margin:0;
color:#e8edf7
}

.wrap{
max-width:1000px;
margin:auto;
padding:16px
}

.winner{
background:linear-gradient(120deg,#332b00,#122447);
border:1px solid var(--g);
border-radius:16px;
padding:18px;
text-align:center;
margin-bottom:18px
}

.winner h2,
.section-title{
color:var(--g)
}

.winner h2{
margin:0 0 10px
}

.winner img{
width:92px;
height:92px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--g)
}

.winner strong{
display:block;
font-size:20px;
margin-top:8px
}

.meta{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:12px 0
}

.pill{
background:#14284b;
border:1px solid #2a426a;
border-radius:999px;
padding:8px 12px;
font-size:13px
}

.songs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:12px
}

.song{
background:var(--p);
border:1px solid #23385e;
border-radius:14px;
padding:14px;
display:flex;
gap:12px;
align-items:center;
min-width:0
}

.song img{
width:70px;
height:70px;
border-radius:10px;
object-fit:cover;
background:#162749
}

.info{
min-width:0;
flex:1
}

.song h3{
font-size:16px;
margin:0 0 5px;
overflow-wrap:anywhere
}

.song p{
font-size:13px;
color:var(--m);
margin:0 0 10px
}

.btn{
display:inline-block;
background:var(--g);
color:#06122a;
text-decoration:none;
font-weight:bold;
border:0;
border-radius:9px;
padding:10px 13px;
cursor:pointer
}

.empty{
padding:22px;
text-align:center;
color:var(--m);
background:var(--p);
border-radius:12px
}

.foot{
text-align:center;
color:var(--m);
padding:28px 10px;
font-size:13px
}
</style>
</head>

<body>

<!-- X CLOSE BUTTON -->

<div class="close-area">
<button
class="close-button"
type="button"
aria-label="Close music streaming page"
onclick="closeMusicPage()">
×
</button>
</div>

<header>
<h1>BEST STREAMING SONG OF THE MONTH</h1>
<p>Your music. Your moment. Your stage.</p>
</header>

<main class="wrap">

<section class="winner">
<h2>🏆 OFFICIAL WINNER</h2>
<div id="winnerBox">Winner will be announced here.</div>
</section>

<div class="meta">
<span class="pill" id="status">Loading competition…</span>
<span class="pill" id="dates">Opening and closing dates not set</span>
</div>

<h2 class="section-title">🔥 CURRENT TOP 3</h2>

<div class="songs" id="topSongs">
<div class="empty">Loading rankings…</div>
</div>

<h2 class="section-title">🎵 ALL SONGS</h2>

<div class="songs" id="allSongs">
<div class="empty">Loading songs…</div>
</div>

<div class="foot">
KULZZY RADIO · Celebrating Lives Everyday
</div>

</main>

<script>

/*
CLOSE MUSIC STREAMING PAGE

When opened inside Kulzzy Radio Navigation,
send KULZZY_APP_BACK to the parent navigation.

The existing navigation message listener handles
this message and returns to the VOTERS competition list.

No browser-history navigation is used inside the iframe.
*/

function closeMusicPage(){

    if(window.parent && window.parent !== window){

        window.parent.postMessage({
            type:"KULZZY_APP_BACK"
        },"*");

        return;
    }

    if(window.history.length > 1){
        window.history.back();
    }
}

</script>

<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
getDatabase,
ref,
onValue
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import{
getAuth,
signInAnonymously
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const cfg={

apiKey:"AIzaSyAYZyCFYGP2Kk_JUiyc9N9TkUXfb9pv9E",

authDomain:"music-streaming-e724e.firebaseapp.com",

databaseURL:"https://music-streaming-e724e-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"music-streaming-e724e",

storageBucket:"music-streaming-e724e.firebasestorage.app",

messagingSenderId:"543568067808",

appId:"1:543568067808:web:495540085bf8b3e080a485",

measurementId:"G-7KMXGYVCF9"

};


const app=initializeApp(cfg);

const db=getDatabase(app);

const auth=getAuth(app);

const $=x=>document.getElementById(x);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));


let songs={},
votes={},
settings={},
winner={};


signInAnonymously(auth).catch(console.warn);


function dt(v){

if(!v)return"TBA";

const d=new Date(v);

return isNaN(d)?"TBA":d.toLocaleDateString();

}


function render(){

const list=Object.entries(songs).map(([id,s])=>{

let n=0;

Object.values(votes[id]||{}).forEach(month=>{
n+=Object.keys(month||{}).length;
});

return{
id,
...s,
plays:n
};

}).filter(s=>s.active!==false)
.sort((a,b)=>b.plays-a.plays);


$("status").textContent=settings.openDate&&settings.closeDate?

(Date.now()<new Date(settings.openDate)
?"Competition opens soon":

Date.now()>new Date(settings.closeDate)
?"Competition closed":

"Competition is open"):

"Competition dates not set";


$("dates").textContent=
"Opens: "+dt(settings.openDate)+
" · Closes: "+dt(settings.closeDate);


$("winnerBox").innerHTML=winner.name?

((winner.photo?
'<img alt="" src="'+esc(winner.photo)+'">':
"")+

'<strong>'+esc(winner.name)+'</strong>'+

'<p>'+esc(winner.songTitle||"")+'</p>'):

"Winner will be announced here.";


const card=s=>

'<article class="song">'+

(s.photo?
'<img alt="" src="'+esc(s.photo)+'">':
'<div style="width:70px;height:70px;background:#162749;border-radius:10px"></div>')+

'<div class="info">'+

'<h3>'+esc(s.title||"Untitled song")+'</h3>'+

'<p>'+
esc(s.artist||"Unknown artiste")+
' · '+s.plays+
' qualifying streams</p>'+

'<a class="btn" href="player.html?song='+
encodeURIComponent(s.id)+
'" target="_blank" rel="noopener">Listen & Support</a>'+

'</div></article>';


$("topSongs").innerHTML=list.length?

list.slice(0,3).map(card).join(""):

'<div class="empty">No songs have been added yet.</div>';


$("allSongs").innerHTML=list.length?

list.map(card).join(""):

'<div class="empty">Songs will appear here soon.</div>';

}


onValue(ref(db,"songs"),s=>{

songs=s.val()||{};

render();

},e=>{

$("allSongs").innerHTML=
'<div class="empty">Could not load songs. Check Firebase rules.</div>';

console.error(e);

});


onValue(ref(db,"votes"),s=>{

votes=s.val()||{};

render();

});


onValue(ref(db,"settings"),s=>{

settings=s.val()||{};

render();

});


onValue(ref(db,"winner"),s=>{

winner=s.val()||{};

render();

});

</script>

</body>
</html>
