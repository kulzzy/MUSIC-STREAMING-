<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06122a">
<title>Listen | Kulzzy Radio</title>

<style>
:root{--n:#06122a;--p:#0c1c3b;--g:#ffd700}
*{box-sizing:border-box}
body{margin:0;background:var(--n);color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:650px;margin:auto;padding:20px}
.card{background:var(--p);border:1px solid #2b4065;border-radius:18px;padding:20px;text-align:center;margin-top:20px}
h1{font-size:24px;color:var(--g)}
img{width:140px;height:140px;border-radius:16px;object-fit:cover}
p{color:#c4cee0;line-height:1.5}
audio{width:100%;margin:18px 0}
.btn{display:inline-block;background:var(--g);color:#06122a;text-decoration:none;font-weight:bold;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
.status{background:#10284b;padding:12px;border-radius:10px;margin:12px 0}
.small{font-size:12px;color:#9facbf}
</style>
</head>

<body>

<main class="wrap">
  <div class="card">

    <h1 id="title">Loading song…</h1>

    <img id="photo" alt="Artiste photo" hidden>

    <p id="artist"></p>

    <audio id="audio" controls preload="metadata"></audio>

    <div class="status" id="status">
      Loading song details…
    </div>

    <p>
      Keep this page open and listen for at least 60 seconds.
      One qualifying stream per account per song per month.
    </p>

    <a class="btn" href="index.html">Back to rankings</a>

    <p class="small">
      Keep Kulzzy Radio open in its original tab.
      This listening page is separate.
    </p>

  </div>
</main>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{getDatabase,ref,get,set}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import{getAuth,signInAnonymously}
from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig={
  apiKey:"AIzaSyAYZyCFYGP2Kk_JUiyc9N9TkLUXfb9pv9E",
  authDomain:"music-streaming-e724e.firebaseapp.com",
  databaseURL:"https://music-streaming-e724e-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"music-streaming-e724e",
  storageBucket:"music-streaming-e724e.firebasestorage.app",
  messagingSenderId:"543568067808",
  appId:"1:543568067808:web:495540085bf8b3e080a485",
  measurementId:"G-7KMXGYVCF9"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

const $=id=>document.getElementById(id);
const audio=$("audio");

const songId=new URLSearchParams(location.search).get("song");

const now=new Date();
const month=String(now.getFullYear())+
            String(now.getMonth()+1).padStart(2,"0");

let started=false;
let seconds=0;
let done=false;
let timer=null;
let recording=false;


function message(text){
  $("status").textContent=text;
}


function stopTimer(){
  if(timer){
    clearInterval(timer);
    timer=null;
  }
}


function stopMusicPage(){

  started=false;

  stopTimer();

  try{
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
  }catch(error){}

  if(!done){
    seconds=0;
    message("Playback stopped because another Kulzzy player started.");
  }
}


/* UNIVERSAL MEDIA CONTROL STOP CONNECTION */

window.KULZZY_STOP_PLAYER=function(){
  stopMusicPage();
};


/* RECORD QUALIFYING STREAM */

async function recordStream(){

  if(recording)return;

  recording=true;

  try{

    const uid=auth.currentUser.uid;

    const voteRef=ref(
      db,
      "votes/"+songId+"/"+month+"/"+uid
    );

    const previous=await get(voteRef);

    if(previous.exists()){
      message("You have already earned a qualifying stream for this song this month.");
      return;
    }

    await set(voteRef,{
      qualifiedAt:Date.now()
    });

    message("Thank you! Your qualifying stream has been recorded.");

  }catch(error){

    message("Could not record stream. Check database rules.");

    console.error(error);

  }finally{
    recording=false;
  }
}


/* LISTENING TIMER */

function beginListening(){

  if(done || timer)return;

  started=true;

  timer=setInterval(async()=>{

    if(
      done ||
      !started ||
      audio.paused ||
      audio.ended
    ){
      return;
    }

    seconds++;

    if(seconds>=60){

      done=true;

      started=false;

      stopTimer();

      await recordStream();
    }

  },1000);
}


/* LOAD SONG */

async function loadSong(){

  if(!songId){
    message("No song selected.");
    return;
  }

  try{

    await signInAnonymously(auth);

    const songSnapshot=await get(
      ref(db,"songs/"+songId)
    );

    const song=songSnapshot.val();

    if(!song){
      message("Song not found.");
      return;
    }

    $("title").textContent=song.title||"Song";

    $("artist").textContent=song.artist||"";

    if(song.photo){
      $("photo").src=song.photo;
      $("photo").hidden=false;
    }

    let audioUrl=song.url||"";

    const driveMatch=audioUrl.match(
      /drive\.google\.com\/file\/d\/([^/]+)/
    );

    if(driveMatch){
      audioUrl=
        "https://drive.google.com/uc?export=download&id="+
        driveMatch[1];
    }

    const settingsSnapshot=await get(
      ref(db,"settings")
    );

    const settings=settingsSnapshot.val()||{};

    if(
      settings.openDate &&
      Date.now()<new Date(settings.openDate).getTime()
    ){
      message("Competition has not opened yet.");
      audio.controls=false;
      return;
    }

    if(
      settings.closeDate &&
      Date.now()>new Date(settings.closeDate).getTime()
    ){
      message("Competition is closed.");
      audio.controls=false;
      return;
    }

    audio.src=audioUrl;

    message("Press play to begin listening.");

    audio.addEventListener("play",()=>{

      if(done)return;

      started=true;

      beginListening();

    });

    audio.addEventListener("pause",()=>{

      started=false;

      if(!done){
        message("Paused. Resume playback to continue.");
      }

    });

    audio.addEventListener("ended",()=>{

      started=false;

      if(!done){
        message("Song ended before 60 seconds. Listen again to qualify.");
      }

    });

    audio.addEventListener("error",()=>{

      if(!done){
        message("Could not play this song. Please try again.");
      }

    });

  }catch(error){

    message("Could not load song. Check Firebase rules and song link.");

    console.error(error);

  }
}


loadSong();

</script>

<!-- UNIVERSAL MEDIA CONTROL CONNECTOR -->
<script src="./connector.js"></script>

</body>
</html>
